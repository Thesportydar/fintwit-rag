name: Deploy AgentCore Agent

on:
  push:
    branches:
      - master
    paths:
      - "lambdas/agent/**"
      - "scripts/build_and_push_agent.sh"
      - "scripts/deploy_agentcore.sh"
      - ".github/workflows/deploy-agentcore.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable ECR tag; defaults to the commit SHA"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy AgentCore
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.AGENTCORE_ECR_REPOSITORY }}
      RUNTIME_ID: ${{ vars.AGENTCORE_RUNTIME_ID }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ secrets.AWS_ROLE_ARN }}"
          aws-region: "${{ vars.AWS_REGION }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image URI
        id: image
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "uri=${registry}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: lambdas/agent
          file: lambdas/agent/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          provenance: false

      - name: Update AgentCore runtime
        env:
          AGENTCORE_RUNTIME_ID: ${{ env.RUNTIME_ID }}
          AGENTCORE_IMAGE_URI: ${{ steps.image.outputs.uri }}
          AGENTCORE_CLIENT_TOKEN: fintwit-agent-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: ./scripts/deploy_agentcore.sh ""
