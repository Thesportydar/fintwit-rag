name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - "lambdas/**"
      - "tests/**"
      - "evals/**"
      - "terraform/**"
      - "docs/**"
      - "pyproject.toml"
      - "ui/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-agentcore.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e . pyarrow pandas ruff

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Check formatting and lint
        run: ruff check lambdas tests evals

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize mutable layer
        run: terraform -chdir=terraform/main init -backend=false

      - name: Prepare generated layer artifact for validation
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          artifact = Path("lambdas/pipeline_layer.zip")
          with ZipFile(artifact, "w"):
              pass
          PY

      - name: Validate mutable layer
        run: terraform -chdir=terraform/main validate -no-color

      - name: Initialize persistent layer
        run: terraform -chdir=terraform/persistent init -backend=false

      - name: Validate persistent layer
        run: terraform -chdir=terraform/persistent validate -no-color

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
