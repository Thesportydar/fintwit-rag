[project]
name = "fintwit-rag"
version = "0.1.0"
description = "Fintwit Agent"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "openai>=2.41.1",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.3.2",
    "langchain-aws",
    "langgraph>=1.2.5",
    "langgraph-checkpoint-aws>=1.1.0",
    "bedrock-agentcore>=1.22.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "ag-ui-langgraph>=0.0.40",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatting)
    "E402", # module level import not at top of file (scripts / evals setup)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "unit: Tests unitarios rápidos sin dependencias externas",
    "e2e: Tests de punta a punta contra la API en AWS",
    "eval: Evaluaciones de calidad LLM con DeepEval",
]
